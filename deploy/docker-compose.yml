# 마케팅 자동화 — docker-compose
#
# NAS에서 영구 실행하기 위한 정의.
# 시놀로지 Container Manager(GUI)에서도 'docker-compose import' 가능.
#
# 사용법:
#   1) NAS에 이 폴더(./marketing_automation/) 전체를 업로드
#   2) cd marketing_automation/deploy
#   3) docker compose up -d --build
#
# 처음에는 OAuth/블덱스 로그인을 해야 하므로 한 번 PC에서 로그인을 끝낸 뒤
# config/ 폴더만 NAS로 복사해도 됩니다 (그 후 컨테이너 재시작).

services:
  marketing-automation:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: marketing-automation:latest
    container_name: marketing-automation
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # config/output/screenshots는 호스트에 영속화
      - ../config:/app/config
      - ../output:/app/output
      - ../screenshots:/app/screenshots
    environment:
      - TZ=Asia/Seoul
      # 외부 접속용 비밀번호는 config/auth.json으로 관리됨
      # 별도 환경변수 불필요
    # 시놀로지 Container Manager에서 NAS의 reverse proxy를 쓰면
    # 별도 ngrok 없이도 외부 접속 가능 (HTTPS + 기본 도메인)
